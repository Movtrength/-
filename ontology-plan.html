<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Movtrength · 온톨로지 받기</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--ink2:#5b616e;--ink3:#8b909c;--line:#e3e6ec;--blue:#2f6df6;--blue-bg:#eef3ff;--amber:#b06d05;--amber-bg:#fdf3e3}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--ink:#e9ecf1;--ink2:#a2a9b6;--ink3:#727a89;--line:#262b34;--blue:#7aa2ff;--blue-bg:#1a2338;--amber:#e8b360;--amber-bg:#2b2113}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6;padding:16px 14px 80px}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:16px;margin:0 0 8px}
.sub{font-size:13px;color:var(--ink3);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.dl{grid-template-columns:1fr}}
button,.btn{border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:9px;font-weight:700;font:inherit;width:100%;text-align:center;text-decoration:none;display:block}
button.ghost,.btn.ghost{background:var(--blue-bg);color:var(--blue)}
.note{background:var(--amber-bg);border-left:3px solid var(--amber);padding:8px 10px;font-size:13px;margin:10px 0 0}
.sent{background:var(--blue-bg);border-radius:10px;padding:10px 12px;font-weight:650;margin:0 0 10px}
ul,ol{margin:8px 0 0;padding-left:20px}
li{margin:4px 0}
a{color:var(--blue)}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--ink3);background:var(--bg);border-radius:999px;padding:2px 8px;margin:0 4px 4px 0}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:10px;font-size:12px;overflow:auto;max-height:40vh}
</style>
</head>
<body>
<div class="card">
  <h1>온톨로지 받기</h1>
  <p class="sub">구성 계획과 지금까지 잠긴 칸. JSON과 HTML을 받을 수 있습니다.<br>
  이 장은 덤프입니다. 판은 <a href="dashboard.html">dashboard.html</a>. 지금 답할 것은 <a href="today.html">today.html</a> 파란 칸입니다.</p>
  <div class="dl">
    <button type="button" id="dlJson">JSON 받기</button>
    <button type="button" id="dlHtml">HTML 받기</button>
    <a class="btn ghost" href="today.html" download="today.html">오늘 한 장 HTML</a>
    <a class="btn ghost" href="지금.md" download="지금.md">지금.md 받기</a>
  </div>
  <p class="note" id="dlMsg">전화에서는 파일이 바로 안 내려가면, 아래 링크를 길게 눌러 저장하세요.</p>
  <p class="sub" style="margin:10px 0 0">
    JSON: <a id="jsonLink" href="ontology.json">ontology.json</a><br>
    HTML: <a id="htmlLink" href="ontology-plan.html">ontology-plan.html</a>
  </p>
</div>

<div id="view"></div>

<script>
const dump = JSON.parse(document.getElementById('dump').textContent);
const pretty = JSON.stringify(dump, null, 2);

function card(title, body){
  return `<div class="card"><h2>${title}</h2>${body}</div>`;
}
function lis(arr){ return `<ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`; }

const L = dump.plan.layers;
const T = L.L3.items;
const R = L.L4.seats;
const open = dump.open;

document.getElementById('view').innerHTML = [
  card('지금 열린 칸', `
    <div class="sent">${open.cell}</div>
    <p class="sub">${open.status}</p>
    ${lis(open.lines.map((t,i)=>`${i+1}. ${t}`))}
    <p class="note">아닌 것: ${open.not}</p>
  `),
  card('묶음', `
    <div class="sent">${dump.plan.binding}</div>
    <p>${dump.plan.binding_note}</p>
    <p>목표: ${dump.plan.goals.join(' · ')}</p>
    <p>${dump.meta.note}</p>
    <p>최종 형태: ${dump.meta.final_form}</p>
  `),
  card('L0 공리', `<p class="sub">${L.L0.role}</p>${lis(L.L0.items)}`),
  card('L1 렌즈', `
    <p>${L.L1.items.join(' · ')}</p>
    <p>${L.L1.open}</p>
    <p class="note">아닌 것: ${L.L1.not}</p>
  `),
  card('L2 존재', `
    <p>${L.L2.items.join(' · ')}</p>
    <p>Category = ${L.L2.category_is} ${L.L2.category_values.join(' / ')}</p>
    ${lis(Object.values(L.L2.arrows))}
  `),
  card('L3 시간', `
    <p>쓰지 않는 말: ${L.L3.do_not_say}</p>
    <div class="sent">${L.L3.gate}</div>
    <ul>
      <li><b>오늘</b> — ${T['오늘'].text}</li>
      <li><b>이 블록</b> — ${T['이 블록'].text} ${T['이 블록'].not}</li>
      <li><b>이 관계</b> — ${T['이 관계'].text} ${T['이 관계'].not}</li>
      <li><b>이 시즌</b> — ${T['이 시즌'].text} ${T['이 시즌'].not} ${T['이 시즌'].not_career}</li>
    </ul>
  `),
  card('L4 기록', `
    <p>기록 1: ${L.L4.record_1}</p>
    <ul>
      ${Object.entries(R).map(([k,v])=>`<li><b>${k}</b> <span class="tag">${v.status}</span> — ${v.text}</li>`).join('')}
    </ul>
  `),
  card('아웃풋 엔진', `<p><b>${dump.plan.output_engine.name}</b> — ${dump.plan.output_engine.role} ${dump.plan.output_engine.file} ${dump.plan.output_engine.rule}</p>`),
  card('커리어 화살', `
    <div class="sent">${dump.plan.career_path.arrow}</div>
    <p>${dump.plan.career_path.누적}</p>
    <p>${dump.plan.career_path.today}</p>
    <p class="note">아닌 것: ${dump.plan.career_path.not}</p>
  `),
  card('순환', `
    <div class="sent">${dump.loop.cycle}</div>
    <p>${dump.loop.one_variable}</p>
    <ol>${dump.loop.timeline.map(x=>`<li><b>${x.step}</b> — ${x.does}</li>`).join('')}</ol>
  `),
  card('잠긴 칸', `
    <p>${dump.locked.close_owner}</p>
    <p><b>열기가 받는 것</b></p>${lis(dump.locked.open_receives)}
    <p><b>오늘</b></p>${lis(dump.locked.today)}
    <p><b>닫기가 남기는 것</b></p>${lis(dump.locked.close_leaves)}
    <p><b>여덟 문</b> — ${dump.locked.close_checks_note}</p>
    ${lis(dump.locked.close_checks.map(x=>`${x.id} ${x.text}`))}
    <p><b>이 순환이 쓰는 공리</b></p>${lis(dump.locked.axioms_this_loop_uses)}
    <p>${dump.locked.name_profile_category.name_neq_profile}. ${dump.locked.name_profile_category.example}</p>
  `),
  card('확인 필요', lis(dump['확인_필요'])),
  card('뺀 것', lis(dump.dropped.map(x=>`<b>${x.item}</b> — ${x.why}`))),
  card('하지 말 것', lis(dump.meta.do_not)),
  card('원문 JSON', `<pre>${pretty.replace(/</g,'&lt;')}</pre>`)
].join('');

function saveBlob(name, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  document.getElementById('dlMsg').textContent = name + '을 받았습니다. 안 내려가면 아래 링크를 길게 누르세요.';
}

document.getElementById('dlJson').onclick = ()=>{
  saveBlob('ontology.json', new Blob([pretty], {type:'application/json'}));
};
document.getElementById('dlHtml').onclick = ()=>{
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  saveBlob('ontology-plan.html', new Blob([html], {type:'text/html'}));
};

async function offerFile(href, name, type){
  try{
    const res = await fetch(href);
    if(!res.ok) return;
    const blob = new Blob([await res.blob()], {type});
    const url = URL.createObjectURL(blob);
    const a = document.getElementById(name==='ontology.json' ? 'jsonLink' : 'htmlLink');
    if(a && href.endsWith(name)) a.href = url;
  }catch(_){}
}
offerFile('ontology.json','ontology.json','application/json');
</script>
